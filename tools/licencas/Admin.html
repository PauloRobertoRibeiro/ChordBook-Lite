<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Licenças ChordBook Lite</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 24px auto; padding: 0 16px; color: #111; }
      label, input, button { font: inherit; }
      input { width: 100%; padding: 8px; margin: 6px 0 12px; box-sizing: border-box; }
      button { background: #2563eb; color: #fff; border: 0; border-radius: 8px; padding: 10px 14px; margin-right: 8px; }
      .card { background: #eef4ff; border-radius: 12px; padding: 14px; margin: 16px 0; }
      .num { font-size: 1.4rem; letter-spacing: 0.08em; font-weight: 700; }
      table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
      td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid #e5e7eb; }
      .muted { color: #6b7280; }
    </style>
  </head>
  <body>
    <h1>Licenças ChordBook Lite</h1>
    <p class="muted">Número fixo do comprador. CVV novo em cada venda ou telemóvel. Depois de activar, o CVV antigo deixa de servir.</p>
    <label>Senha de administrador (ADMIN_KEY)</label>
    <input id="key" type="password" autocomplete="current-password" />
    <label>E-mail do comprador (opcional)</label>
    <input id="email" type="email" placeholder="comprador@..." />
    <p>
      <button type="button" id="issue">Nova venda (número + CVV)</button>
      <button type="button" id="list">Actualizar lista</button>
    </p>
    <div class="card" id="out" hidden></div>
    <h2>Compradores</h2>
    <div id="table"></div>
    <p class="muted">Novo CVV: escreva o número na caixa abaixo e clique Rodar.</p>
    <input id="rotateNumber" placeholder="6112 3478 9012 3456" />
    <button type="button" id="rotate">Novo CVV (anula o telemóvel antigo)</button>
    <script>
      function group(n) {
        return String(n || "").replace(/\D/g, "").replace(/(.{4})/g, "$1 ").trim();
      }
      function showPair(data) {
        const box = document.getElementById("out");
        box.hidden = false;
        box.innerHTML = "<p>Envie isto ao comprador:</p><p class='num'>" + group(data.number) + "</p><p>CVV: <strong>" + data.cvv + "</strong></p>";
      }
      function key() { return document.getElementById("key").value; }
      document.getElementById("issue").onclick = () => {
        google.script.run.withSuccessHandler((data) => {
          if (!data || !data.ok) { alert("Senha errada ou erro."); return; }
          showPair(data);
          document.getElementById("list").click();
        }).adminIssue(key(), document.getElementById("email").value);
      };
      document.getElementById("rotate").onclick = () => {
        google.script.run.withSuccessHandler((data) => {
          if (!data || !data.ok) { alert("Não encontrado ou senha errada."); return; }
          showPair(data);
          document.getElementById("list").click();
        }).adminRotate(key(), document.getElementById("rotateNumber").value);
      };
      document.getElementById("list").onclick = () => {
        google.script.run.withSuccessHandler((data) => {
          if (!data || !data.ok) { alert("Senha errada."); return; }
          document.getElementById("table").innerHTML = "<table><tr><th>Número</th><th>CVV actual</th><th>Telemóvel</th><th>E-mail</th></tr>" +
            (data.rows || []).map((row) => "<tr><td>" + group(row.number) + "</td><td>" + row.cvv + "</td><td>" + row.device + "</td><td>" + (row.email || "") + "</td></tr>").join("") +
            "</table>";
        }).adminList(key());
      };
    </script>
  </body>
</html>
