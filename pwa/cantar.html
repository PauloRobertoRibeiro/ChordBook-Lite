<!doctype html>
<html lang="pt-BR" translate="no" class="notranslate">
  <head>
    <meta charset="utf-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ececec" />
    <meta name="robots" content="noindex" />
    <title>Letra</title>
    <link rel="icon" href="./icons/favicon.png?v=104" />
    <style>
      :root {
        --bg: #ececec;
        --row: #f7f7f7;
        --on: #6d6d6d;
        --on-text: #fff;
        --text: #222;
        --muted: #666;
        --card: #f3f3f3;
        --line: #ddd;
      }
      * { box-sizing: border-box; }
      html, body {
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", Roboto, system-ui, sans-serif;
        margin: 0;
        min-height: 100%;
      }
      body {
        padding: calc(8px + env(safe-area-inset-top)) 0 calc(16px + env(safe-area-inset-bottom));
      }
      header {
        padding: 8px 16px 4px;
      }
      header strong {
        display: block;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      header span {
        color: var(--muted);
        font-size: 12px;
      }
      nav {
        background: var(--row);
        border-bottom: 1px solid var(--line);
        border-top: 1px solid var(--line);
      }
      nav button {
        background: transparent;
        border: 0;
        border-bottom: 1px solid var(--line);
        color: var(--text);
        cursor: pointer;
        display: block;
        font-size: 16px;
        font-weight: 700;
        line-height: 1.25;
        padding: 12px 16px;
        text-align: left;
        width: 100%;
      }
      nav button:last-child { border-bottom: 0; }
      nav button.on {
        background: var(--on);
        color: var(--on-text);
      }
      nav button::before {
        content: "•  ";
      }
      main {
        background: var(--card);
        margin: 12px;
        min-height: 40vh;
        padding: 16px 16px 32px;
      }
      main p {
        font-size: 17px;
        line-height: 1.45;
        margin: 0 0 6px;
        white-space: pre-wrap;
      }
      main .head {
        color: var(--muted);
        font-size: 15px;
        font-weight: 700;
        margin: 14px 0 6px;
      }
      main .head:first-child { margin-top: 0; }
      .err, .empty {
        color: var(--muted);
        padding: 24px 16px;
      }
    </style>
  </head>
  <body>
    <header>
      <strong id="packTitle">Letra</strong>
      <span id="packHint"></span>
    </header>
    <nav id="songNav" hidden></nav>
    <main id="lyricMain"></main>
    <script src="./share-lyrics.js?v=130"></script>
    <script src="./cantar.js?v=130"></script>
  </body>
</html>
